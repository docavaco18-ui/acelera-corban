<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      width: 320px;
      padding: 20px;
    }
    h1 { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: #f8fafc; }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      background: #1e293b; border-radius: 8px; padding: 12px;
      margin-bottom: 16px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-text { font-size: 13px; font-weight: 600; }
    .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; margin-top: 12px; }
    input {
      width: 100%; padding: 8px 10px; border-radius: 6px;
      background: #1e293b; border: 1px solid #334155;
      color: #e2e8f0; font-size: 12px; font-family: monospace;
    }
    input:focus { outline: 2px solid #0ea5e9; border-color: transparent; }
    button {
      width: 100%; padding: 10px; border-radius: 8px;
      border: none; font-size: 13px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
    }
    .btn-primary { background: #0ea5e9; color: #fff; }
    .btn-primary:hover { background: #0284c7; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .btn-save { background: #22c55e; color: #fff; }
    .btn-save:hover { background: #16a34a; }
    .msg { font-size: 11px; margin-top: 8px; padding: 6px 10px; border-radius: 6px; }
    .msg.ok { background: #14532d; color: #86efac; }
    .msg.err { background: #7f1d1d; color: #fca5a5; }
    .divider { border: none; border-top: 1px solid #1e293b; margin: 16px 0; }
    .help { font-size: 11px; color: #64748b; margin-top: 12px; line-height: 1.5; }
    a { color: #0ea5e9; text-decoration: none; }
  </style>
</head>
<body>
  <h1>⚡ Acelera Corban — Mercantil</h1>

  <div class="status-row" id="statusRow">
    <div class="dot" id="statusDot" style="background:#94a3b8"></div>
    <span class="status-text" id="statusText">Verificando…</span>
  </div>

  <div class="label">URL do Backend</div>
  <input type="text" id="backendUrl" placeholder="https://aceleracorban.com.br" />

  <div class="label">Token da Extensão</div>
  <input type="text" id="extensionToken" placeholder="Cole o token do dashboard" />

  <button class="btn-save" id="btnSave">Salvar configuração</button>
  <button class="btn-primary" id="btnPush" disabled>Enviar sessão agora</button>

  <div id="msg" style="display:none" class="msg"></div>

  <hr class="divider">
  <p class="help">
    <b>Como usar:</b><br>
    1. Acesse o dashboard → Configurações → copie o <b>Token da Extensão</b><br>
    2. Cole acima e salve<br>
    3. Acesse <a href="https://meu.bancomercantil.com.br" target="_blank">meu.bancomercantil.com.br</a> e faça login<br>
    4. A extensão envia a sessão automaticamente ✓
  </p>

  <script src="popup.js"></script>
</body>
</html>
